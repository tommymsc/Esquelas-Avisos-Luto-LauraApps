name: Compilar Esquelas y Avisos de Luto (APK)

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'improve/**', 'config/**', 'release/**']

permissions:
  contents: read

jobs:
  build:
    name: Android 16 - Debug APK y verificaciones
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK Android disponible en runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar plataforma Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Pruebas Java independientes
        run: |
          mkdir -p .build/test
          javac -Xlint:all -d .build/test app/src/main/java/com/lauraapps/esquelas/ProjectRules.java tests/ProjectRulesTest.java
          java -ea -cp .build/test com.lauraapps.esquelas.ProjectRulesTest
      - name: Validación del proyecto y JavaScript
        run: |
          python3 tests/verify_package.py
          node --check tests/demo.js
      - name: Compilar AAB release y APK debug con verificación lint
        run: gradle :app:bundleRelease :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Comprobar AAB y APK
        run: |
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/bundle/release/app-release.aab | tail -n 1
          sha256sum app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab
          echo "AAB sin firma. No subir a Play Console sin firmar con clave de subida." >> "$GITHUB_STEP_SUMMARY"
      - name: Subir AAB sin firma
        id: aab_artifact
        uses: actions/upload-artifact@v4
        timeout-minutes: 4
        with:
          name: Esquelas-v2-0-AAB-release-sin-firmar
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Publicar reportes de lint
        if: failure() && steps.aab_artifact.outcome != 'failure'
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: Esquelas-Reportes-Lint
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14
