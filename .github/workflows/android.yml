name: Compilar Esquelas y Avisos de Luto (APK)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Android 16 - Debug APK y verificaciones
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK Android
        uses: android-actions/setup-android@v3
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar plataforma Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Pruebas Java independientes
        run: |
          mkdir -p .build/test
          javac -Xlint:all -d .build/test app/src/main/java/com/lauraapps/esquelas/ProjectRules.java tests/ProjectRulesTest.java
          java -ea -cp .build/test com.lauraapps.esquelas.ProjectRulesTest
      - name: Validación del proyecto y JavaScript
        run: |
          python3 tests/verify_package.py
          node --check tests/demo.js
      - name: Compilar APK y analizar Android
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon --stacktrace --warning-mode all
      - name: Verificar APK generado
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Esquelas-Avisos-Luto-v1-7-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publicar reportes de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Esquelas-Reportes-Lint
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14
