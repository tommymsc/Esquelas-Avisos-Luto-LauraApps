name: Esquelas y Avisos de Luto - QA y AAB optimizado

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master, 'improve/**']

permissions:
  contents: read

jobs:
  build:
    name: Android 16 - QA, R8 y AAB cuando hay firma
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK Android disponible en runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Instalar plataforma Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Pruebas Java independientes
        run: |
          mkdir -p .build/test
          javac -Xlint:all -d .build/test app/src/main/java/com/lauraapps/esquelas/ProjectRules.java tests/ProjectRulesTest.java
          java -ea -cp .build/test com.lauraapps.esquelas.ProjectRulesTest
      - name: Validación del proyecto y JavaScript
        run: |
          python3 tests/verify_package.py
          node --check tests/demo.js
      - name: Compilar APK y analizar Android
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon --stacktrace --warning-mode all
      - name: Verificar APK generado
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Esquelas-Avisos-Luto-v1-9-1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Validar versión y configuración R8
        run: |
          grep -q 'versionCode 14' app/build.gradle
          grep -q "versionName '2.0.3'" app/build.gradle
          grep -q 'minSdk 29' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'minifyEnabled true' app/build.gradle
          grep -q 'shrinkResources true' app/build.gradle
          grep -q 'play-services-ads:25.5.0' app/build.gradle
          grep -q 'user-messaging-platform:4.0.0' app/build.gradle
          test -s app/proguard-rules.pro
      - name: Compilar R8 QA con anuncios de prueba sin secretos de producción
        run: gradle --no-daemon :app:assembleR8Qa --stacktrace
      - name: Verificar mapping R8 del build QA
        run: |
          test -s app/build/outputs/mapping/r8Qa/mapping.txt
          test -s app/build/outputs/apk/r8Qa/app-r8Qa.apk
          sha256sum app/build/outputs/apk/r8Qa/app-r8Qa.apk
      - name: Publicar APK QA optimizado (NO subir a Play)
        uses: actions/upload-artifact@v4
        with:
          name: Esquelas-1.9.1-R8-QA-APK-NO-PLAY
          path: app/build/outputs/apk/r8Qa/*.apk
          if-no-files-found: error
      - name: Preparar secretos de firma y AdMob para producción
        id: signing
        env:
          ESQUELAS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ESQUELAS_UPLOAD_KEYSTORE_BASE64 }}
          ESQUELAS_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ESQUELAS_UPLOAD_KEYSTORE_PASSWORD }}
          ESQUELAS_UPLOAD_KEY_ALIAS: ${{ secrets.ESQUELAS_UPLOAD_KEY_ALIAS }}
          ESQUELAS_UPLOAD_KEY_PASSWORD: ${{ secrets.ESQUELAS_UPLOAD_KEY_PASSWORD }}
          ESQUELAS_ADMOB_APP_ID: ${{ secrets.ESQUELAS_ADMOB_APP_ID }}
          ESQUELAS_ADMOB_BANNER_UNIT_ID: ${{ secrets.ESQUELAS_ADMOB_BANNER_UNIT_ID }}
          ESQUELAS_ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ESQUELAS_ADMOB_INTERSTITIAL_UNIT_ID }}
        run: python3 scripts/configure_release_signing.py
      - name: Compilar AAB release firmado con R8
        if: steps.signing.outputs.release_ready == 'true'
        env:
          ESQUELAS_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ESQUELAS_UPLOAD_KEYSTORE_PASSWORD }}
          ESQUELAS_UPLOAD_KEY_ALIAS: ${{ secrets.ESQUELAS_UPLOAD_KEY_ALIAS }}
          ESQUELAS_UPLOAD_KEY_PASSWORD: ${{ secrets.ESQUELAS_UPLOAD_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ESQUELAS_ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_BANNER_UNIT_ID: ${{ secrets.ESQUELAS_ADMOB_BANNER_UNIT_ID }}
          ORG_GRADLE_PROJECT_ADMOB_INTERSTITIAL_UNIT_ID: ${{ secrets.ESQUELAS_ADMOB_INTERSTITIAL_UNIT_ID }}
        run: gradle --no-daemon :app:bundleRelease --stacktrace
      - name: Verificar mapping de R8 y firma del bundle
        if: steps.signing.outputs.release_ready == 'true'
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab 2>&1 | tee /tmp/esquelas-signature.txt
          grep -q 'jar verified' /tmp/esquelas-signature.txt
      - name: Publicar AAB firmado para Play
        if: steps.signing.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Esquelas-v1.9.1-CODIGO10-AAB-FIRMADO
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Publicar mapping para desofuscación
        if: steps.signing.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Esquelas-v1.9.1-CODIGO10-R8-MAPPING
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Publicar reportes de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Esquelas-Reportes-Lint
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14
