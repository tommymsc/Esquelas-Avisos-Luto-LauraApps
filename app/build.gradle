plugins { id 'com.android.application' }
android {
    namespace 'com.lauraapps.esquelas'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lauraapps.esquelas'
        minSdk 29
        targetSdk 36
        versionCode 10
        versionName '1.9.1'
    }
    buildFeatures { buildConfig true }
    def realAppId = (project.findProperty('ADMOB_APP_ID') ?: 'ca-app-pub-2506564165861733~2453279576').toString()
    def realBanner = (project.findProperty('ADMOB_BANNER_UNIT_ID') ?: 'ca-app-pub-2506564165861733/5215174288').toString()
    def realInterstitial = (project.findProperty('ADMOB_INTERSTITIAL_UNIT_ID') ?: 'ca-app-pub-2506564165861733/4281366564').toString()
    buildTypes {
        debug {
            // Separate Google's test application ID from the production AdMob app.
            manifestPlaceholders = [ADMOB_APP_ID: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'BANNER_AD_UNIT', '"ca-app-pub-3940256099942544/9214589741"'
            buildConfigField 'String', 'INTERSTITIAL_AD_UNIT', '"ca-app-pub-3940256099942544/1033173712"'
        }
        release {
            manifestPlaceholders = [ADMOB_APP_ID: realAppId]
            minifyEnabled false
            buildConfigField 'String', 'BANNER_AD_UNIT', '"'+ (realAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') && realBanner.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ? realBanner : '') +'"'
            buildConfigField 'String', 'INTERSTITIAL_AD_UNIT', '"'+ (realAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') && realInterstitial.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ? realInterstitial : '') +'"'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}

/**
 * Never ship a production package that accidentally contains Google's demo app ID.
 * Debug builds intentionally use test IDs and remain freely buildable.
 */
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    doFirst {
        def appId = (project.findProperty('ADMOB_APP_ID') ?: 'ca-app-pub-2506564165861733~2453279576').toString()
        def bannerId = (project.findProperty('ADMOB_BANNER_UNIT_ID') ?: 'ca-app-pub-2506564165861733/5215174288').toString()
        def interstitialId = (project.findProperty('ADMOB_INTERSTITIAL_UNIT_ID') ?: 'ca-app-pub-2506564165861733/4281366564').toString()
        if (!appId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') ||
            !bannerId.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ||
            !interstitialId.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ||
            appId.startsWith('ca-app-pub-3940256099942544')) {
            throw new GradleException(
                'Release bloqueada: configura los IDs reales de AdMob para esta aplicación.')
        }
    }
}
