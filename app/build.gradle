plugins { id 'com.android.application' }
android {
    namespace 'com.lauraapps.esquelas'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lauraapps.esquelas'
        minSdk 29
        targetSdk 36
        versionCode 9
        versionName '1.9.0'
    }
    buildFeatures { buildConfig true }
    def realAppId = (project.findProperty('ADMOB_APP_ID') ?: '').toString()
    def realBanner = (project.findProperty('ADMOB_BANNER_UNIT_ID') ?: '').toString()
    def realInterstitial = (project.findProperty('ADMOB_INTERSTITIAL_UNIT_ID') ?: '').toString()
    defaultConfig {
        manifestPlaceholders = [ADMOB_APP_ID: realAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') ? realAppId : 'ca-app-pub-3940256099942544~3347511713']
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'BANNER_AD_UNIT', '"ca-app-pub-3940256099942544/9214589741"'
            buildConfigField 'String', 'INTERSTITIAL_AD_UNIT', '"ca-app-pub-3940256099942544/1033173712"'
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'BANNER_AD_UNIT', '"'+ (realAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') && realBanner.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ? realBanner : '') +'"'
            buildConfigField 'String', 'INTERSTITIAL_AD_UNIT', '"'+ (realAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') && realInterstitial.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ? realInterstitial : '') +'"'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
