plugins { id 'com.android.application' }
android {
    namespace 'com.lauraapps.esquelas'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lauraapps.esquelas'
        minSdk 29
        targetSdk 36
        versionCode 15
        versionName '2.0.4'
    }
    buildFeatures { buildConfig true }
    def realAppId = (project.findProperty('ADMOB_APP_ID') ?: '').toString()
    def realBanner = (project.findProperty('ADMOB_BANNER_UNIT_ID') ?: '').toString()
    def realInterstitial = (project.findProperty('ADMOB_INTERSTITIAL_UNIT_ID') ?: '').toString()
    defaultConfig {
        manifestPlaceholders = [ADMOB_APP_ID: realAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') ? realAppId : 'ca-app-pub-3940256099942544~3347511713']
    }
    // Signing is configured only when CI provides a verified upload-key keystore.
    def uploadStore = System.getenv('ESQUELAS_UPLOAD_KEYSTORE_PATH')
    def uploadStorePassword = System.getenv('ESQUELAS_UPLOAD_KEYSTORE_PASSWORD')
    def uploadAlias = System.getenv('ESQUELAS_UPLOAD_KEY_ALIAS')
    def uploadKeyPassword = System.getenv('ESQUELAS_UPLOAD_KEY_PASSWORD')
    if (uploadStore && uploadStorePassword && uploadAlias && uploadKeyPassword) {
        signingConfigs {
            upload {
                storeFile file(uploadStore)
                storePassword uploadStorePassword
                keyAlias uploadAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'BANNER_AD_UNIT', '"ca-app-pub-3940256099942544/9214589741"'
            buildConfigField 'String', 'INTERSTITIAL_AD_UNIT', '"ca-app-pub-3940256099942544/1033173712"'
        }
        // R8 QA build: genuine optimized code, Google test ad IDs, DEBUG signing only.
        // This build must NEVER be uploaded to Play; release still requires real IDs and key.
        r8Qa {
            initWith release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            manifestPlaceholders = [ADMOB_APP_ID: 'ca-app-pub-3940256099942544~3347511713']
            buildConfigField 'String', 'BANNER_AD_UNIT', '"ca-app-pub-3940256099942544/9214589741"'
            buildConfigField 'String', 'INTERSTITIAL_AD_UNIT', '"ca-app-pub-3940256099942544/1033173712"'
        }
        release {
            if (signingConfigs.findByName('upload') != null) signingConfig signingConfigs.upload
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'BANNER_AD_UNIT', '"'+ (realAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') && realBanner.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ? realBanner : '') +'"'
            buildConfigField 'String', 'INTERSTITIAL_AD_UNIT', '"'+ (realAppId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') && realInterstitial.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ? realInterstitial : '') +'"'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}

/**
 * Never ship a production package that accidentally contains Google's demo app ID.
 * Debug builds intentionally use test IDs and remain freely buildable.
 */
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    doFirst {
        def appId = (project.findProperty('ADMOB_APP_ID') ?: '').toString()
        def bannerId = (project.findProperty('ADMOB_BANNER_UNIT_ID') ?: '').toString()
        def interstitialId = (project.findProperty('ADMOB_INTERSTITIAL_UNIT_ID') ?: '').toString()
        if (!appId.matches('ca-app-pub-[0-9]{16}~[0-9]{10}') ||
            !bannerId.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ||
            !interstitialId.matches('ca-app-pub-[0-9]{16}/[0-9]{10}') ||
            appId.startsWith('ca-app-pub-3940256099942544')) {
            throw new GradleException(
                'Release bloqueada: configura los IDs reales de AdMob para esta aplicación.')
        }
    }
}
